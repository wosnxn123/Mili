name: mili CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# 普通构建只产出候选包，没有创建 tag 或 Release 的权限。
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-cross:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RUST_TARGETS: x86_64-pc-windows-gnu,x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 25
      - name: 校验启动器
        run: python3 -I scripts/download_launcher.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu,x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu
      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0
      - name: 准备交叉编译器
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 gcc-aarch64-linux-gnu g++-aarch64-linux-gnu clang lld build-essential pkg-config libssl-dev zlib1g-dev
          cargo install cargo-zigbuild --locked
          command -v x86_64-w64-mingw32-gcc
          command -v aarch64-linux-gnu-gcc
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY || '' }}
          gradle-home-cache-cleanup: true
          cache-exclude: |
            **/paperweight/**
      - name: 设置补丁工作树提交身份
        run: |
          git config --global user.email 'noreply@github.com'
          git config --global user.name 'Mili CI'
          git config --global init.defaultBranch main
          chmod +x gradlew
      - name: 执行 Rust 测试及三目标构建
        env:
          CC_x86_64_pc_windows_gnu: x86_64-w64-mingw32-gcc
          CXX_x86_64_pc_windows_gnu: x86_64-w64-mingw32-g++
        run: |
          cargo test --locked --release --manifest-path mili-rust/src/rust/Cargo.toml
          ./gradlew :mili-rust:stageRustBinary --no-configuration-cache
          verify_native() {
            local source="mili-rust/build/cargo-target/$1/release/$2" destination="mili-rust/build/rust/$3"
            test -s "$source" && test -s "$destination" && cmp "$source" "$destination"
          }
          verify_native x86_64-pc-windows-gnu mili_optimizer.dll mili_optimizer.dll
          verify_native x86_64-unknown-linux-gnu libmili_optimizer.so libmili_optimizer.so
          verify_native aarch64-unknown-linux-gnu libmili_optimizer.so libmili_optimizer_aarch64.so
      - name: 在干净基线上应用所有补丁
        run: |
          ./gradlew applyAllPatches --no-configuration-cache
          for dir in paper-api paper-server folia-server mili-server/src/minecraft/java; do test -d "$dir"; done
          test -s mili-server/src/main/java/dev/kaiijumc/kaiiju/KaiijuEntityThrottler.java
          test -s mili-server/src/minecraft/java/net/minecraft/server/MinecraftServer.java
          python3 -I scripts/inject_kotlin.py
      - name: 执行 API、服务端及启动器测试
        run: |
          ./gradlew :mili-api:test :mili-server:test :mili-server:verifyLauncherPatch --no-configuration-cache
          python3 -I scripts/verify_test_results.py
      - name: 打包并在空缓存重放发行补丁
        env:
          BSTATS_ID: ${{ secrets.BSTATS_PLUGIN_ID }}
        run: |
          ./gradlew :mili-server:createPaperclipJar --no-configuration-cache "-PbstatsPluginId=$BSTATS_ID"
          python3 -I scripts/smoke_test_launcher.py mili-server/build/libs/*-paperclip-*.jar
          sh scripts/SetENV.sh
      - uses: actions/upload-artifact@v7
        with:
          name: mili-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/mili-candidate/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  native-runtime:
    needs: build-and-cross
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 25
      - uses: actions/download-artifact@v8
        with:
          name: mili-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/mili-candidate
      - name: 验证同一候选 JAR 内的 JNI 和 TOML 往返
        shell: bash
        run: python -I scripts/smoke_test_native.py "$RUNNER_TEMP/mili-candidate/mili-26.3-paperclip.jar"
